<!doctype html>
<html lang="ja">
<head>

<title>試験カウントダウン 試作</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e5ea; font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: #1c1c1e; -webkit-text-size-adjust: 100%; }

  /* 試作の操作バー（アプリの一部ではない） */

  .bar .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }

  .task .range { font-size: 40px; font-weight: 700; letter-spacing: -0.5px; margin: 4px 0 18px; }
  .task .doneline { font-size: 20px; font-weight: 600; color: #34c759; margin: 6px 0 4px; }

  .mat { background: #fff; border-radius: 16px; margin: 12px 16px 0; padding: 16px 18px; }

  /* タブバー */
  .tabs { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 390px; display: flex; background: rgba(247,247,249,0.94); backdrop-filter: blur(12px); border-top: 1px solid #e5e5ea; padding: 6px 0 calc(8px + env(safe-area-inset-bottom)); }
  .tabs a { flex: 1; text-align: center; font-size: 11px; color: #8e8e93; position: relative; }

  .tabs .badge { position: absolute; top: 0; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 4px; background: #ff3b30; }

  /* 記録のシート */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { width: 100%; max-width: 390px; background: #fff; border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet .h { font-size: 17px; font-weight: 600; text-align: center; }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 22px 0; }
  .stepper button { width: 52px; height: 52px; border-radius: 26px; border: none; background: #eef2fb; color: #2f6fde; font-size: 26px; }

  .stepper input { font: inherit; width: 2.6em; border: none; border-bottom: 2px solid #d1d1d6; text-align: center; padding: 0; background: transparent; color: inherit; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .sheet .hint.ahead { color: #2b8a3e; } .sheet .hint.late { color: #8e8e93; }

  /* 最初の設定 */
  .steps { display: flex; gap: 6px; padding: 16px 20px 0; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: #d1d1d6; }
  .steps span.on { background: #2f6fde; }
  .setup h1 { font-size: 26px; margin: 14px 20px 4px; }
  .setup .lead { font-size: 15px; color: #636366; margin: 0 20px 6px; line-height: 1.5; }
  .card { background: #fff; border-radius: 14px; margin: 12px 16px; padding: 14px 16px; }
  .field { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #e5e5ea; font-size: 16px; gap: 10px; }
  .field:first-child { border-top: none; }
  .field .v { color: #2f6fde; text-align: right; }
  .hint2 { color: #8e8e93; font-size: 13px; line-height: 1.5; }
  .linkish { color: #2f6fde; font-size: 15px; padding: 6px 0 0; }
  .wk { display: grid; grid-template-columns: 3.2em 1fr 1fr 1fr; gap: 6px; font-size: 15px; align-items: center; }
  .wk .h { font-size: 12px; color: #8e8e93; }
  .wk .c { background: #f2f2f7; border-radius: 8px; padding: 7px 8px; text-align: center; color: #2f6fde; }
  .next-btn { display: block; margin: 20px 16px 0; width: calc(100% - 32px); }
  .bignum { font-size: 15px; color: #636366; }
  .bignum b { font-size: 30px; color: #1c1c1e; }
  .confirm li { margin: 8px 0; font-size: 15px; line-height: 1.5; }
  .confirm ul { padding-left: 1.2em; margin: 6px 0; }
  .muted { color: #8e8e93; font-size: 13px; }

  /* 設定・進め方・見本 */
  .back { font-size: 16px; padding: 14px 16px 0; display: block; }
  .list { background: #fff; border-radius: 14px; margin: 16px 16px 0; }
  .list a, .list div { display: flex; justify-content: space-between; padding: 14px 16px; border-top: 1px solid #e5e5ea; font-size: 16px; color: #1c1c1e; }
  .list > :first-child { border-top: none; }
  .list span { color: #8e8e93; }
  .method { scroll-margin-top: 10px; }
  .method h3 { font-size: 17px; margin: 0 0 6px; }
  .method dl { margin: 0; font-size: 14px; line-height: 1.6; }
  .method dt { color: #8e8e93; font-size: 12px; margin-top: 6px; }
  .method dd { margin: 0; }
  .wall { margin: 12px 16px; border-radius: 22px; padding: 18px; background: linear-gradient(160deg, #5b7fbf, #8a6bb8); color: #fff; }
  .wall .clock { text-align: center; font-size: 64px; font-weight: 300; line-height: 1; }
  .wall .wdate { text-align: center; font-size: 16px; opacity: 0.9; margin-bottom: 4px; }
  .wall .inline { text-align: center; font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .notif { background: rgba(255,255,255,0.85); color: #1c1c1e; border-radius: 16px; padding: 10px 12px; font-size: 14px; margin-top: 8px; line-height: 1.45; }
  .notif b { font-size: 13px; }
  .notif .t { float: right; color: #8e8e93; font-size: 12px; }
  .widget { width: 158px; height: 158px; border-radius: 22px; background: #fff; color: #1c1c1e; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
  .widget .e { font-size: 12px; color: #8e8e93; }
  .widget .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .widget .n small { font-size: 14px; }
  .widget .r { font-size: 14px; font-weight: 600; color: #2f6fde; }
  .cap { font-size: 13px; color: #636366; margin: 14px 20px 0; }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
// ---------- 日付 ----------
const DAY = 86400000;
const d2n = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const dt = n => new Date(n * DAY);
const WD = '日月火水木金土';
const wd = n => dt(n).getUTCDay();
const md = n => `${dt(n).getUTCMonth() + 1}/${dt(n).getUTCDate()}`;
const mdw = n => `${md(n)}（${WD[wd(n)]}）`;
const range = (a, b) => { const r = []; for (let i = a; i < b; i++) r.push(i); return r; };

// ---------- 例のデータ（SA 科目B） ----------
const S = {
  exam: { name: 'SA 科目B', date: d2n('2027-01-30'), start: d2n('2026-11-03') },
  week: [ // 0=日
    { h: 4, t: '10:00', p: '自宅' },
    { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' },
    { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' },
    { h: 5, t: '10:00', p: '図書館' },
  ],
  bufferWd: 0,
  mats: [
    { id: 'a', name: 'テキスト', unit: 'ページ', end: 360, done0: 0 },
    { id: 'b', name: '午後I 過去問', unit: '問', end: 40, done0: 3 },
    { id: 'c', name: '午後II 論文', unit: '本', end: 8, done0: 0 },
  ],
  today: 0, pos: {}, weekStartPos: {},
};
const hours = n => S.week[wd(n)].h;
const sumH = (a, b) => range(a, b).reduce((s, n) => s + hours(n), 0);
const totalDays = () => S.exam.date - S.exam.start;
const reviewLen = () => Math.min(28, Math.max(1, Math.round(totalDays() * 0.15)));
const reviewStart = () => S.exam.date - reviewLen();
const secondHalfStart = () => S.exam.start + Math.ceil((reviewStart() - S.exam.start) / 2);
const isBuffer = n => S.bufferWd !== null && wd(n) === S.bufferWd;

// 量を空き時間に比例して割り振る。初日から足し合わせた量で丸めるので、合計は必ず amount になる
function alloc(days, amount) {
  const W = days.reduce((s, n) => s + hours(n), 0);
  let c = 0;
  return days.map(n => { c += hours(n); return W ? Math.round(amount * c / W) : 0; });
}
// fromDay の時点で fromPos まで終わっているとして、復習期間の前日まで割り振る
function plan(m, fromDay, fromPos) {
  const days = range(fromDay, reviewStart()).filter(n => !isBuffer(n));
  const cum = alloc(days, m.end - fromPos);
  const map = new Map(days.map((n, i) => [n, fromPos + cum[i]]));
  return n => { let v = fromPos; for (const d of days) { if (d > n) break; v = map.get(d); } return v; };
}
// その日を含む週（予備日で終わる区切り）の初日
function segStart(n) {
  let d = n - 1;
  while (d >= S.exam.start && !isBuffer(d)) d--;
  return Math.max(S.exam.start, d + 1);
}
const P0 = m => plan(m, S.exam.start, m.done0);
const defaultWeekStart = (m, n) => { const s = segStart(n); return s === S.exam.start ? m.done0 : P0(m)(s - 1); };

// ---------- 表示用の言い方 ----------
const U = {
  'ページ': { r: (a, b) => a === b ? `p.${a}` : `p.${a}〜${b}`, at: p => `p.${p}`, thru: p => `p.${p}まで`, left: k => `あと${k}ページ`, n: k => `${k}ページ` },
  '問': { r: (a, b) => a === b ? `問${a}` : `問${a}〜問${b}`, at: p => `問${p}`, thru: p => `問${p}まで`, left: k => `あと${k}問`, n: k => `${k}問` },
  '本': { r: (a, b) => a === b ? `${a}本目` : `${a}〜${b}本目`, at: p => p === '' ? '' : `${p}本`, after: '本', thru: p => `${p}本`, left: k => `あと${k}本`, n: k => `${k}本` },
};

// ---------- その日の状態を出す ----------
function stateOf(m) {
  const t = S.today, pos = S.pos[m.id], u = U[m.unit];
  if (t < S.exam.start) return { phase: 'before' };
  if (t >= reviewStart()) {
    const days = range(reviewStart(), S.exam.date);
    const cum = alloc(days, m.end);
    const i = days.indexOf(t);
    const a = (i ? cum[i - 1] : 0) + 1, b = cum[i];
    return { phase: 'review', range: b >= a ? u.r(a, b) : null, daysLeft: S.exam.date - t };
  }
  const s = segStart(t);
  const ws = S.weekStartPos[m.id] ?? defaultWeekStart(m, t);
  const p0 = P0(m);
  const Pw = ws === (s === S.exam.start ? m.done0 : p0(s - 1)) ? p0 : plan(m, s, ws);
  const y = t > s ? Pw(t - 1) : ws;   // 昨日までの予定
  const th = Pw(t);                    // 今日までの予定
  const behind = Math.max(0, y - pos);
  const ahead = Math.max(0, pos - th);
  let next = null;
  for (let d = t + 1; d < reviewStart(); d++) { if (Pw(d) > Pw(d - 1)) { next = d; break; } }
  // ペースの見込み（記録が1週間分たまってから。予定に対して何割進んでいるかで見る）
  let risk = null;
  if (t - S.exam.start >= 7) {
    const planned = p0(t - 1) - m.done0;
    const ratio = planned > 0 ? (pos - m.done0) / planned : 1;
    if (ratio < 0.8) risk = Math.floor(m.done0 + ratio * (m.end - m.done0));
  }
  const base = { behind, ahead, risk, next, rangeEnd: th, redistributed: S.weekStartPos[m.id] !== undefined };
  if (isBuffer(t)) return { ...base, phase: 'buffer', range: pos < th ? u.r(pos + 1, th) : null };
  const from = Math.max(pos, y);
  return { ...base, phase: 'study', range: th > from ? u.r(from + 1, th) : null, todayHad: th > y, newWeek: t === s && t !== S.exam.start };
}

// ---------- 場面の見本 ----------
const PRESETS = {
  start:      { label: '初日（予定どおり）', f: () => { S.today = S.exam.start; } },
  behind:     { label: '週の途中で遅れ', f: () => { S.today = d2n('2026-11-12'); S.pos.a = P0(S.mats[0])(S.today - 1) - 6; } },
  ahead:      { label: '予定より先に進んでいる', f: () => { S.today = d2n('2026-11-12'); S.pos.a = P0(S.mats[0])(S.today) + 5; } },
  bufBehind:  { label: '予備日・遅れあり', f: () => { S.today = d2n('2026-11-15'); S.pos.a = P0(S.mats[0])(S.today - 1) - 6; } },
  bufOk:      { label: '予備日・遅れなし', f: () => { S.today = d2n('2026-11-15'); } },
  newWeek:    { label: '新しい週（遅れを配り直し）', f: () => { S.today = d2n('2026-11-16'); const p = P0(S.mats[0])(S.today - 1) - 6; S.pos.a = p; S.weekStartPos.a = p; } },
  second:     { label: '後半に入った', f: () => { S.today = secondHalfStart() + 1; } },
  risk:       { label: '間に合わない見込み', f: () => { S.today = d2n('2026-12-01'); const m = S.mats[0]; const p = m.done0 + Math.floor((P0(m)(S.today - 1) - m.done0) * 0.7); S.pos.a = p; S.weekStartPos.a = p; } },
  review:     { label: '復習期間', f: () => { S.today = reviewStart() + 2; } },
  before:     { label: '始める日より前', f: () => { S.today = d2n('2026-11-01'); } },
};
function applyPreset(k) {
  S.pos = {}; S.weekStartPos = {};
  S.today = S.exam.start;
  PRESETS[k].f();
  for (const m of S.mats) if (S.pos[m.id] === undefined) S.pos[m.id] = S.today < S.exam.start ? m.done0 : (S.today >= reviewStart() ? m.end : P0(m)(S.today - 1));
  if (S.today === S.exam.start) for (const m of S.mats) S.pos[m.id] = m.done0;
}

// ---------- 根拠の一言（1画面に1つ。短く） ----------
const WHY = {
  proximal: ['大きな目標は、小さく分けると取りかかりやすくなります。', 'proximal'],
  intent: ['いつ・どこでやるかを決めておくと、取りかかれる割合が上がります。', 'intent'],
  fallacy: ['人は、かかる時間を少なく見積もりがちです。だから週に1日、予備日を取っています。', 'fallacy'],
  fresh: ['週の初めは、仕切り直しにちょうどよい区切りです。', 'lapse'],
  lapse: ['1日できなくても、習慣は崩れません。まず1ページだけ開いてみましょう。', 'lapse'],
  progFirst: ['前半は「どれだけ終わったか」を見るほうが、続けやすくなります。', 'small'],
  progSecond: ['後半は「あと少し」を見るほうが、最後まで続けやすくなります。', 'small'],
  retrieval: ['読み返すより、解き直すほうが記憶に残ります。', 'retrieval'],
  spacing: ['一度に詰め込むより、日を分けて学ぶほうが記憶に残ります。', 'spacing'],
};
const why = k => k ? `<div class="why">${WHY[k][0]} <a href="#" data-go="methods" data-anchor="${WHY[k][1]}">根拠 ›</a></div>` : '';

// ---------- アイコン ----------
const ICON = {
  today: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
  remain: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9"/></svg>',
  progress: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>',

// ---------- 時刻（日付は試作の「今日」、時刻は実際の時刻。操作バーでずらせる） ----------
let clockOffset = 0; // 秒
const realSec = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000; };
const nowSec = () => ((realSec() + clockOffset) % 86400 + 86400) % 86400;
const toSec = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 3600 + m * 60; };
const hhmm = sec => { sec = Math.round(sec) % 86400; return `${Math.floor(sec / 3600)}:${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}`; };
const hms = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 3600)}:${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };
// 今日の勉強時間の枠と、いまどこにいるか
function todayWindow() {
  const t = S.today, w = S.week[wd(t)];
  const start = toSec(w.t), len = w.h * 3600, now = nowSec();
  const active = t >= S.exam.start && t < S.exam.date && len > 0;
  const state = !active ? 'none' : now < start ? 'before' : now < start + len ? 'during' : 'after';
  const left = state === 'before' ? len : state === 'during' ? start + len - now : 0;
  return { start, end: start + len, len, now, state, left };
}
// 試験までの残り（秒）。今日の分は、勉強時間の枠のうちまだ過ぎていない分だけ数える
function remainingSec() {
  if (S.today < S.exam.start) return sumH(S.exam.start, S.exam.date) * 3600;
  return todayWindow().left + sumH(S.today + 1, S.exam.date) * 3600;
}

// ---------- 画面の状態 ----------
const TABS = ['remain', 'today', 'progress', 'settings'];
let view = 'remain', preset = 'start', sheet = null;
const params = new URLSearchParams(location.search);
if (params.get('view')) view = params.get('view');
if (params.get('preset')) preset = params.get('preset');
if (params.get('sheet')) sheet = { id: params.get('sheet'), v: null };
const showBar = params.get('bar') !== '0';
applyPreset(preset);

// 時刻の見本（勉強時間の枠に対して、前・最中・後）。'real' は実際の時刻
const CLOCKS = [['real', '実際の時刻'], ['before', '勉強時間の30分前'], ['during', '勉強時間の途中'], ['after', '勉強時間のあと']];
let clockSel = 'real';
function setClock(k) {
  clockSel = k;
  if (k === 'real') { clockOffset = 0; return; }
  const w = S.week[wd(S.today)], st = toSec(w.t), len = w.h * 3600;
  const target = k === 'before' ? st - 1800 : k === 'during' ? st + len * 0.4 : st + len + 1800;
  clockOffset = target - realSec();
}
function bar() {
  if (!showBar) return '';
  const views = { setup1: '設定①', setup2: '設定②', setup3: '設定③', setup4: '設定④', remain: '残り', today: '今日', progress: '進み具合', settings: '設定', widgets: 'ウィジェット・通知', methods: '進め方' };

    <div class="row note">試作の操作バー（アプリの一部ではない）。今日: ${mdw(S.today)}</div>
  </div>`;
}
const topBar = left => left ? `<div class="top"><span class="date">${left}</span></div>` : '<div class="top"></div>';
function tabs() {

}

// ---------- 今日 ----------
function today() {
  const t = S.today, w = S.week[wd(t)];
  const sts = S.mats.map(m => [m, stateOf(m)]);
  const ph = sts[0][1].phase;
  let out = topBar(mdw(t));

  if (ph === 'before') {
    return out + `<div class="calm"><div class="big">${mdw(S.exam.start)} から始めます</div>
      <div class="small">それまでは、何もしなくて大丈夫です。</div></div>`;
  }

  if (ph === 'review') {
    out += `<div class="title">今日の復習</div><div class="subtitle">${w.t}〜 ${w.p}<span id="todayleft"></span>・復習期間はあと${sts[0][1].daysLeft}日</div>`;
    for (const [m, s] of sts) if (s.range) out += `<div class="task"><div class="name">${m.name}</div><div class="range">${s.range}</div><button class="btn">終わった</button></div>`;
    return out + `<div class="rest">復習期間は、記録を付けなくてもかまいません。</div>` + why('retrieval');
  }

  const buffer = ph === 'buffer';
  const s0 = sts[0][1];

  if (buffer && sts.every(([, s]) => !s.range)) {
    return out + `<div class="calm"><div class="big">今日は予備日です</div>
      <div class="small">今週は遅れがありません。<br>休んでも、先に進んでもかまいません。</div></div>` + why('fallacy');
  }

  out += `<div class="title">${buffer ? '今日は予備日' : s0.newWeek ? '新しい週です' : '今日やること'}</div>`;
  out += `<div class="subtitle">${w.t}〜 ${w.p}<span id="todayleft"></span>${buffer ? '・今週の遅れを取り戻す日' : ''}</div>`;

  for (const [m, s] of sts) {
    const u = U[m.unit];
    if (s.range) {
      out += `<div class="task"><div class="name">${m.name}</div><div class="range">${s.range}</div>
        <button class="btn" data-done="${m.id}" data-end="${s.rangeEnd}">終わった</button>
        <button class="btn ghost" data-sheet="${m.id}">進んだところを入れる</button></div>`;
    } else if (!buffer && (s.todayHad || s.ahead > 0)) {
      out += `<div class="task"><div class="name">${m.name}</div>
        <div class="doneline">✓ 今日の分は終わりました</div>
        <div class="ahead">${u.thru(S.pos[m.id])}終わっています${s.ahead > 0 ? `（予定より ${u.n(s.ahead)} 先）` : ''}</div>
        <button class="btn ghost" data-sheet="${m.id}">もっと進めた</button></div>`;
    }
  }
  const idle = sts.filter(([, s]) => !s.range && !(!buffer && (s.todayHad || s.ahead > 0)));
  if (idle.length) out += `<div class="rest">${idle.map(([m]) => m.name).join('・')}は、今日はお休みです。</div>`;

  let k = null;
  if (buffer) k = 'fallacy';
  else if (s0.newWeek && s0.redistributed) k = 'fresh';
  else if (sts.some(([, s]) => s.behind > 0)) k = 'lapse';
  else if (S.today === S.exam.start) k = 'proximal';
  return out + why(k);
}

// ---------- 残り ----------
const RING_R = 88, RING_C = 2 * Math.PI * RING_R;
function remain() {
  const total = sumH(S.exam.start, S.exam.date);  // 最初にあった時間
  // 12時の位置から時計回りに「過ぎた時間」が広がり、残りの弧が減っていく
  return topBar('') + `<div class="remain">
      <div class="label">${S.exam.name}まで、勉強に使える時間</div>
      <div class="ring">
        <svg viewBox="0 0 200 200" width="280" height="280">
          <circle cx="100" cy="100" r="${RING_R}" fill="none" stroke="#e5e5ea" stroke-width="12"/>
          <circle id="arc" cx="100" cy="100" r="${RING_R}" fill="none" stroke="#2f6fde" stroke-width="12" transform="rotate(-90 100 100)"/>
        </svg>
        <div class="center"><div class="a">あと</div><div class="num"><span id="remH"></span><small>時間</small></div><div class="of">${total}時間中</div></div>
      </div>

      <div class="sub">試験日 ${mdw(S.exam.date)}・あと${S.exam.date - S.today}日</div></div>
    <div class="todaybox" id="todaybox"></div>`;
}
// 1秒ごとに数字だけを書き換える（画面全体は描き直さない）
function tickRemain() {
  const total = sumH(S.exam.start, S.exam.date);
  const rem = remainingSec(), f = rem / (total * 3600);
  const remH = Math.floor(rem / 3600), used = Math.floor((total * 3600 - rem) / 3600);
  const arc = document.getElementById('arc');
  if (!arc) return;
  arc.setAttribute('stroke-dasharray', `${f * RING_C} ${RING_C}`);
  arc.setAttribute('stroke-dashoffset', `${-(1 - f) * RING_C}`);
  arc.setAttribute('stroke-linecap', f > 0.01 && f < 0.99 ? 'round' : 'butt');
  document.getElementById('remH').textContent = remH;
  document.getElementById('usedline').innerHTML = used <= 0 ? `最初にある時間は <b>${total}時間</b> です` : `<b>${used}時間</b>が過ぎました（${Math.round(used / total * 100)}%）`;
  const w = todayWindow(), box = document.getElementById('todaybox');
  if (w.state === 'none') { box.innerHTML = S.today < S.exam.start ? '' : `<div class="tb-label">今日は勉強の時間を取っていません</div>`; return; }
  const range = `${hhmm(w.start)}〜${hhmm(w.end)}`;
  box.className = 'todaybox ' + w.state;
  box.innerHTML = w.state === 'before'
    ? `<div class="tb-label">今日の勉強時間 ${range}</div><div class="tb-time">${hms(w.len)}</div><div class="tb-note">始まるまで ${hms(w.start - w.now)}</div>`
    : w.state === 'during'
    ? `<div class="tb-label">今日の勉強時間 あと</div><div class="tb-time">${hms(w.left)}</div><div class="tb-note">${hhmm(w.end)} まで</div>`
    : `<div class="tb-label">今日の勉強時間 ${range}</div><div class="tb-time">0:00:00</div><div class="tb-note">今日の時間は終わりました。おつかれさまでした</div>`;
}
function tickToday() {
  const el = document.getElementById('todayleft');
  if (!el) return;
  const w = todayWindow();
  el.textContent = w.state === 'during' ? `・あと ${hms(w.left)}` : '';
}
setInterval(() => { tickRemain(); tickToday(); }, 1000);

// ---------- 進み具合 ----------
function progress() {
  const t = S.today;
  const sts = S.mats.map(m => [m, stateOf(m)]);
  const ph = sts[0][1].phase;
  let out = topBar(S.exam.name) + `<div class="title">進み具合</div>`;
  if (ph === 'before') return out + `<div class="week">${mdw(S.exam.start)} から始めます</div>`;

  if (ph === 'study' || ph === 'buffer') {
    const late = sts.filter(([, s]) => s.behind > 0);
    const ahead = sts.filter(([, s]) => s.ahead > 0);
    if (late.length) out += `<div class="week late">今週は ${late.map(([m, s]) => `${m.name} ${U[m.unit].n(s.behind)}`).join('・')} 遅れ<span class="note">${ph === 'buffer' ? '今日の予備日で取り戻しましょう' : `${WD[S.bufferWd]}曜の予備日で取り戻します`}</span></div>`;
    else if (ahead.length) out += `<div class="week ok">予定より先に進んでいます<span class="note">${ahead.map(([m, s]) => `${m.name} ${U[m.unit].n(s.ahead)}`).join('・')} 先。予備日のあと、先の日の量を減らします</span></div>`;
    else out += `<div class="week ok">今週は予定どおり</div>`;
  } else {
    out += `<div class="week ok">復習期間です<span class="note">試験まであと${S.exam.date - t}日</span></div>`;
  }

  const risky = sts.find(([, s]) => s.risk !== null && s.risk !== undefined);
  if (risky) {
    const [m, s] = risky;
    out += `<div class="riskbox"><div class="h">このペースだと間に合わない見込みです</div>
      <p>${m.name}は、復習期間に入るまでに ${U[m.unit].at(s.risk)} あたりまでの見込みです（全${U[m.unit].n(m.end)}）。</p>
      <button class="btn">対策を見る</button></div>`;
  }

  const firstHalf = t < secondHalfStart();
  for (const [m] of sts) {
    const pos = S.pos[m.id], u = U[m.unit];
    const pct = Math.round(pos / m.end * 100);
    const right = firstHalf ? (pos === 0 ? 'これから' : `${u.thru(pos)}・${pct}%`) : (pos >= m.end ? '終わりました' : u.left(m.end - pos));
    out += `<div class="mat"><div class="row1"><b>${m.name}</b><span>${right}</span></div><div class="bar2"><i style="width:${pct}%"></i></div></div>`;
  }
  let k = risky ? 'fallacy' : firstHalf ? 'progFirst' : 'progSecond';
  return out + why(k);
}

// ---------- 記録のシート ----------
function hintHtml(m, v) {
  const u = U[m.unit], end = stateOf(m).rangeEnd ?? v, diff = v - end;
  return diff > 0 ? `<div id="hint" class="hint ahead">今日の予定より ${u.n(diff)} 先です</div>`

    : `<div id="hint" class="hint ahead">今日の予定どおりです</div>`;
}

  if (!sheet) return '';

  if (sheet.v === null) sheet.v = Math.max(S.pos[m.id], s.rangeEnd ?? S.pos[m.id]);

}

const METHODS = [
  { id: 'proximal', t: '大きな目標を、今日の小さな範囲に分ける', what: '試験までの範囲を、1日ごとの「今日やる範囲」に分けます。', why: '遠い大きな目標だけを持つより、近くて小さな目標に分けたほうが、自信がつき、成績も上がりました。', app: '「今日」の画面', src: 'Bandura & Schunk (1981)' },
  { id: 'intent', t: 'いつ・どこでやるかを先に決める', what: '「平日 21:00〜 リビングで」のように、始める時刻と場所を決めておきます。', why: '「いつ・どこで・何をするか」を先に決めておくと、実際に取りかかる割合が上がることが、多くの研究で確かめられています。', app: '曜日ごとの時刻と場所。その時刻にお知らせします', src: 'Gollwitzer (1999); Gollwitzer & Sheeran (2006)' },
  { id: 'fallacy', t: '予備日を取る', what: '週に1日、新しい範囲を入れない日を取り、遅れを取り戻す日にします。', why: '人は、かかる時間をいつも少なく見積もります（計画錯誤）。余裕を先に取っておくと、計画が崩れにくくなります。', app: '週に1日の予備日と、ペースの見込み', src: 'Kahneman & Tversky (1979); Buehler ほか (1994)' },
  { id: 'spacing', t: '毎日に分けて学ぶ', what: '試験直前にまとめてやらず、試験日までの毎日に分けます。', why: '一度に詰め込むより、日を分けて学ぶほうが記憶に残ります。', app: '試験日までの毎日への割り振り', src: 'Cepeda ほか (2006); Dunlosky ほか (2013)' },
  { id: 'monitor', t: 'どこまで進んだかを記録する', what: '終わったら「終わった」を押して、進み具合を記録します。', why: '進み具合を記録して確かめると、目標を達成しやすくなります。', app: '「終わった」と、どこまで進んだかの記録', src: 'Harkin ほか (2016)' },
  { id: 'small', t: '前半は「終わった量」、後半は「残りの量」を見る', what: '前半は「問12まで」、後半は「あと8問」と、進み具合の見せ方を変えます。', why: '目標の前半は終わった量を、後半は残りの量を見るほうが、続けやすいことが分かっています。', app: '「進み具合」の画面（自動で切り替わります）', src: 'Koo & Fishbach (2012)' },
  { id: 'lapse', t: '1日休んでも気にしない', what: 'できない日があっても、次の日に戻れば大丈夫です。週の初めは仕切り直しの日にします。', why: '習慣は1日休んでも崩れませんでした。また、週の初めのような区切りの日は、目標に取り組み直しやすくなります。', app: '予備日のあとの「新しい週」。連続日数で責めません', src: 'Lally ほか (2010); Dai, Milkman & Riis (2014)' },
  { id: 'retrieval', t: '読み返すより、解き直す', what: '復習期間には、読み返すより問題を解き直します。', why: '自分で思い出すことは、読み返すよりずっと記憶に残ります。', app: '復習期間の「今日の復習」', src: 'Roediger & Karpicke (2006); Dunlosky ほか (2013)' },
];
let backTo = 'today';
function methods() {
  return `<a class="back" href="#" data-go="${backTo}">‹ 戻る</a><div class="title">このアプリの進め方</div>
    <div class="subtitle" style="line-height:1.5">このアプリの進め方は、研究で効果が確かめられた方法に基づいています。</div>
    ${METHODS.map(m => `<div class="card method" id="m-${m.id}"><h3>${m.t}</h3><dl>
      <dt>何をするか</dt><dd>${m.what}</dd><dt>なぜ効くか</dt><dd>${m.why}</dd>
      <dt>このアプリでは</dt><dd>${m.app}</dd><dt>出典</dt><dd>${m.src}</dd></dl></div>`).join('')}
    <p class="cap">※試作のため、出典はまだ原典で確かめていません。</p>`;
}
function widgets() {
  const m = S.mats[0], s = stateOf(m), w = S.week[wd(S.today)];
  const h = sumH(Math.max(S.today, S.exam.start), S.exam.date);
  const r = s.range || '—';
  return `<a class="back" href="#" data-go="settings">‹ 戻る</a>
    <p class="cap">ロック画面（ウィジェットと通知）</p>
    <div class="wall"><div class="wdate">${mdw(S.today)}</div><div class="clock">${w.t}</div>
      <div class="inline">${h}h・${r}</div>
      <div class="notif"><span class="t">今</span><b>試験カウントダウン</b><br>${w.t} です。${w.p}で${m.name} ${r.split('〜')[0]}〜</div>
      <div class="notif"><span class="t">遅れている日</span><b>試験カウントダウン</b><br>まず1ページだけ開いてみましょう。${m.name} ${U[m.unit].at(S.pos[m.id] + 1)}から</div></div>
    <p class="cap">ホーム画面のウィジェット（小）。押すと「残り」が開く</p>
    <div class="wall"><div class="widget"><div class="e">${S.exam.name}まで</div>
      <div class="n">${h}<small>時間</small></div><div class="r">今日 ${r}</div></div></div>`;
}

// ---------- 描画と操作 ----------
const VIEWS = { today, remain, progress, setup1, setup2, setup3, setup4, settings, methods, widgets };
function render(anchor) {
  const body = VIEWS[view]();
  document.getElementById('app').innerHTML = bar() + body + (TABS.includes(view) ? tabs() : '') + sheetHtml();
  tickRemain(); tickToday();
  if (anchor) { const el = document.getElementById('m-' + anchor); if (el) el.scrollIntoView(); } else if (!sheet) window.scrollTo(0, 0);
}
document.addEventListener('input', e => {
  if (e.target.id !== 'sv') return;
  const m = S.mats.find(x => x.id === sheet.id);
  sheet.v = Math.min(m.end, Math.max(0, Number(e.target.value) || 0));
  document.getElementById('hint').outerHTML = hintHtml(m, sheet.v);
});
document.addEventListener('change', e => {
  if (e.target.id === 'v') { view = e.target.value; render(); }
  if (e.target.id === 'clk') { setClock(e.target.value); render(); return; }
  if (e.target.id === 'p' && PRESETS[e.target.value]) { preset = e.target.value; applyPreset(preset); setClock(clockSel); if (!TABS.includes(view)) view = 'remain'; render(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-done],[data-sheet],[data-step],[data-save],[data-close],#nextDay');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.go) { if (el.dataset.go === 'methods' && view !== 'methods') backTo = view; view = el.dataset.go; render(el.dataset.anchor); return; }
  if (el.dataset.done) { S.pos[el.dataset.done] = Math.max(S.pos[el.dataset.done], Number(el.dataset.end)); render(); return; }
  if (el.dataset.sheet) { sheet = { id: el.dataset.sheet, v: null }; render(); return; }
  if (el.dataset.step) { const m = S.mats.find(x => x.id === sheet.id); sheet.v = Math.min(m.end, Math.max(0, sheet.v + Number(el.dataset.step))); render(); return; }
  if (el.dataset.save) { S.pos[sheet.id] = sheet.v; sheet = null; render(); return; }
  if (el.dataset.close && e.target === el) { sheet = null; render(); return; }
  if (el.id === 'nextDay') {
    const t = S.today;
    if (isBuffer(t)) for (const m of S.mats) S.weekStartPos[m.id] = S.pos[m.id]; // 予備日のあとに配り直す
    S.today = t + 1; preset = ''; setClock(clockSel); render();
  }
});
if (params.get('clock')) setClock(params.get('clock'));
render();
</script>
</body>
</html>
