<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>試験カウントダウン 試作</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e5ea; font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: #1c1c1e; -webkit-text-size-adjust: 100%; }
  .phone { max-width: 390px; min-height: 100vh; margin: 0 auto; background: #f2f2f7; padding-bottom: 32px; }

  /* 試作の操作バー（アプリの一部ではない） */
  .bar { background: #3a3a3c; color: #fff; padding: 8px 12px; font-size: 12px; }
  .bar .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .bar select, .bar button { font-size: 12px; padding: 4px 6px; border-radius: 6px; border: none; }
  .bar .note { color: #aeaeb2; }

  header { padding: 18px 20px 6px; }
  header .exam { font-size: 15px; color: #636366; }
  header h1 { margin: 2px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  header h1 small { font-size: 17px; font-weight: 600; margin-left: 2px; }
  header .sub { font-size: 15px; color: #636366; margin-top: 2px; }

  .card { background: #fff; border-radius: 14px; margin: 12px 16px; padding: 14px 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: #636366; margin: 0 0 8px; }
  .when { font-size: 13px; color: #636366; margin-bottom: 6px; }
  .item { padding: 10px 0; border-top: 1px solid #e5e5ea; }
  .item:first-of-type { border-top: none; }
  .item .name { font-size: 13px; color: #636366; }
  .item .range { font-size: 24px; font-weight: 700; margin: 2px 0 8px; }
  .item .done { font-size: 17px; color: #34c759; font-weight: 600; margin: 4px 0; }
  .item .next { font-size: 14px; color: #8e8e93; }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px; border: none; background: #e9effc; color: #2f6fde; font-weight: 600; }
  .btn.primary { background: #2f6fde; color: #fff; }
  .status { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .status .warn { color: #d9480f; font-weight: 600; }
  .status .ok { color: #2b8a3e; font-weight: 600; }
  .status .prog { color: #3a3a3c; }
  .progs { flex-direction: column; gap: 4px; }
  .banner { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .risk { background: #fff4e6; }
  .risk p { margin: 0 0 10px; font-size: 15px; }

  .tip { margin: 12px 16px; padding: 12px 14px; border-radius: 14px; background: #eef4ff; font-size: 14px; line-height: 1.6; color: #24324d; }
  .tip .label { font-size: 11px; font-weight: 700; color: #2f6fde; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
  .tip a { color: #2f6fde; font-weight: 600; text-decoration: none; white-space: nowrap; }

  .links { text-align: center; font-size: 14px; margin-top: 18px; }
  .links a { color: #2f6fde; text-decoration: none; margin: 0 10px; }

  /* 最初の設定 */
  .steps { display: flex; gap: 6px; padding: 16px 20px 0; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: #d1d1d6; }
  .steps span.on { background: #2f6fde; }
  .setup h1 { font-size: 26px; margin: 14px 20px 4px; }
  .setup .lead { font-size: 15px; color: #636366; margin: 0 20px 6px; line-height: 1.5; }
  .field { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid #e5e5ea; font-size: 16px; gap: 10px; }
  .field:first-child { border-top: none; }
  .field .v { color: #2f6fde; text-align: right; }
  .field .hint { color: #8e8e93; font-size: 13px; }
  .linkish { color: #2f6fde; font-size: 15px; padding: 4px 0 0; }
  .wk { display: grid; grid-template-columns: 3.2em 1fr 1fr 1fr; gap: 6px; font-size: 15px; align-items: center; }
  .wk .h { font-size: 12px; color: #8e8e93; }
  .wk .c { background: #f2f2f7; border-radius: 8px; padding: 7px 8px; text-align: center; color: #2f6fde; }
  .next-btn { display: block; margin: 20px 16px 0; width: calc(100% - 32px); }
  .big { font-size: 15px; color: #636366; }
  .big b { font-size: 30px; color: #1c1c1e; }
  .confirm li { margin: 8px 0; font-size: 15px; line-height: 1.5; }
  .confirm ul { padding-left: 1.2em; margin: 6px 0; }
  .muted { color: #8e8e93; font-size: 13px; }

  /* 進め方のページ */
  .method { scroll-margin-top: 10px; }
  .method h3 { font-size: 17px; margin: 0 0 6px; }
  .method dl { margin: 0; font-size: 14px; line-height: 1.6; }
  .method dt { color: #8e8e93; font-size: 12px; margin-top: 6px; }
  .method dd { margin: 0; }
  .back { color: #2f6fde; font-size: 16px; padding: 14px 16px 0; display: block; text-decoration: none; }

  /* ウィジェット・通知の見本 */
  .wall { margin: 12px 16px; border-radius: 22px; padding: 18px; background: linear-gradient(160deg, #5b7fbf, #8a6bb8); color: #fff; }
  .wall .clock { text-align: center; font-size: 64px; font-weight: 300; line-height: 1; }
  .wall .date { text-align: center; font-size: 16px; opacity: 0.9; margin-bottom: 4px; }
  .wall .inline { text-align: center; font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .notif { background: rgba(255,255,255,0.85); color: #1c1c1e; border-radius: 16px; padding: 10px 12px; font-size: 14px; margin-top: 8px; line-height: 1.45; }
  .notif b { font-size: 13px; }
  .notif .t { float: right; color: #8e8e93; font-size: 12px; }
  .widget { width: 158px; height: 158px; border-radius: 22px; background: #fff; color: #1c1c1e; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
  .widget .e { font-size: 12px; color: #8e8e93; }
  .widget .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .widget .n small { font-size: 14px; }
  .widget .r { font-size: 14px; font-weight: 600; color: #2f6fde; }
  .cap { font-size: 13px; color: #636366; margin: 14px 20px 0; }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
// ---------- 日付 ----------
const DAY = 86400000;
const d2n = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const dt = n => new Date(n * DAY);
const WD = '日月火水木金土';
const wd = n => dt(n).getUTCDay();
const md = n => `${dt(n).getUTCMonth() + 1}/${dt(n).getUTCDate()}`;
const mdw = n => `${md(n)}（${WD[wd(n)]}）`;
const range = (a, b) => { const r = []; for (let i = a; i < b; i++) r.push(i); return r; };

// ---------- 例のデータ（SA 科目B） ----------
const S = {
  exam: { name: 'SA 科目B', date: d2n('2027-01-30'), start: d2n('2026-11-03') },
  week: [ // 0=日
    { h: 4, t: '10:00', p: '自宅' },
    { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' },
    { h: 2, t: '21:00', p: 'リビング' }, { h: 2, t: '21:00', p: 'リビング' },
    { h: 5, t: '10:00', p: '図書館' },
  ],
  bufferWd: 0,
  mats: [
    { id: 'a', name: 'テキスト', unit: 'ページ', end: 360, done0: 0 },
    { id: 'b', name: '午後I 過去問', unit: '問', end: 40, done0: 3 },
    { id: 'c', name: '午後II 論文', unit: '本', end: 8, done0: 0 },
  ],
  today: 0, pos: {}, weekStartPos: {},
};
const hours = n => S.week[wd(n)].h;
const sumH = (a, b) => range(a, b).reduce((s, n) => s + hours(n), 0);
const totalDays = () => S.exam.date - S.exam.start;
const reviewLen = () => Math.min(28, Math.max(1, Math.round(totalDays() * 0.15)));
const reviewStart = () => S.exam.date - reviewLen();
const secondHalfStart = () => S.exam.start + Math.ceil((reviewStart() - S.exam.start) / 2);
const isBuffer = n => S.bufferWd !== null && wd(n) === S.bufferWd;

// 量を空き時間に比例して割り振る。初日から足し合わせた量で丸めるので、合計は必ず amount になる
function alloc(days, amount) {
  const W = days.reduce((s, n) => s + hours(n), 0);
  let c = 0;
  return days.map(n => { c += hours(n); return W ? Math.round(amount * c / W) : 0; });
}
// fromDay の時点で fromPos まで終わっているとして、復習期間の前日まで割り振る
function plan(m, fromDay, fromPos) {
  const days = range(fromDay, reviewStart()).filter(n => !isBuffer(n));
  const cum = alloc(days, m.end - fromPos);
  const map = new Map(days.map((n, i) => [n, fromPos + cum[i]]));
  return n => { let v = fromPos; for (const d of days) { if (d > n) break; v = map.get(d); } return v; };
}
// その日を含む週（予備日で終わる区切り）の初日
function segStart(n) {
  let d = n - 1;
  while (d >= S.exam.start && !isBuffer(d)) d--;
  return Math.max(S.exam.start, d + 1);
}
const P0 = m => plan(m, S.exam.start, m.done0);
const defaultWeekStart = (m, n) => { const s = segStart(n); return s === S.exam.start ? m.done0 : P0(m)(s - 1); };

// ---------- 表示用の言い方 ----------
const U = {
  'ページ': { r: (a, b) => a === b ? `p.${a}` : `p.${a}〜${b}`, thru: p => `p.${p}まで終わった`, left: k => `あと${k}ページ`, n: k => `${k}ページ` },
  '問': { r: (a, b) => a === b ? `問${a}` : `問${a}〜問${b}`, thru: p => `問${p}まで終わった`, left: k => `あと${k}問`, n: k => `${k}問` },
  '本': { r: (a, b) => a === b ? `${a}本目` : `${a}〜${b}本目`, thru: p => `${p}本書いた`, left: k => `あと${k}本`, n: k => `${k}本` },
};

// ---------- その日の状態を出す ----------
function stateOf(m) {
  const t = S.today, pos = S.pos[m.id], u = U[m.unit];
  if (t < S.exam.start) return { phase: 'before' };
  if (t >= reviewStart()) {
    const days = range(reviewStart(), S.exam.date);
    const cum = alloc(days, m.end);
    const i = days.indexOf(t);
    const a = (i ? cum[i - 1] : 0) + 1, b = cum[i];
    return { phase: 'review', range: b >= a ? u.r(a, b) : null, left: pos < m.end ? [pos + 1, m.end] : null, daysLeft: S.exam.date - t };
  }
  const s = segStart(t);
  const ws = S.weekStartPos[m.id] ?? defaultWeekStart(m, t);
  const p0 = P0(m);
  const Pw = ws === (s === S.exam.start ? m.done0 : p0(s - 1)) ? p0 : plan(m, s, ws);
  const y = t > s ? Pw(t - 1) : ws;
  const th = Pw(t);
  const behind = Math.max(0, y - pos);
  const firstHalf = (t - S.exam.start) / (reviewStart() - S.exam.start) < 0.5;
  const prog = pos === 0 ? 'これから' : firstHalf ? `${u.thru(pos)}（${Math.round(pos / m.end * 100)}%）` : u.left(m.end - pos);
  let next = null;
  for (let d = t + 1; d < reviewStart(); d++) { if (Pw(d) > Pw(d - 1)) { next = d; break; } }
  // ペースの見込み（記録が1週間分たまってから）
  let risk = null;
  if (t - S.exam.start >= 7) {
    const planned = p0(t - 1) - m.done0;
    const ratio = planned > 0 ? (pos - m.done0) / planned : 1;
    if (ratio < 0.8) risk = Math.floor(m.done0 + ratio * (m.end - m.done0));
  }
  if (isBuffer(t)) {
    return { phase: 'buffer', catchup: pos < th ? u.r(pos + 1, th) : null, catchEnd: th, prog, risk };
  }
  const from = Math.max(pos, y);
  return {
    phase: 'study', range: th > from ? u.r(from + 1, th) : null, rangeEnd: th, todayHad: th > y,
    behind, behindText: u.n(behind), prog, next, risk, newWeek: t === s && t !== S.exam.start,
  };
}

// ---------- 状態の見本 ----------
const PRESETS = {
  start:      { label: '初日（予定どおり）', f: () => { S.today = S.exam.start; } },
  behind:     { label: '週の途中で遅れ', f: () => { S.today = d2n('2026-11-12'); S.pos.a = P0(S.mats[0])(S.today - 1) - 6; } },
  bufBehind:  { label: '予備日・遅れあり', f: () => { S.today = d2n('2026-11-15'); S.pos.a = P0(S.mats[0])(S.today - 1) - 6; } },
  bufOk:      { label: '予備日・遅れなし', f: () => { S.today = d2n('2026-11-15'); } },
  newWeek:    { label: '新しい週（遅れを配り直し）', f: () => { S.today = d2n('2026-11-16'); const p = P0(S.mats[0])(S.today - 1) - 6; S.pos.a = p; S.weekStartPos.a = p; } },
  second:     { label: '後半に入った', f: () => { S.today = secondHalfStart() + 1; } },
  risk:       { label: '間に合わない見込み', f: () => { S.today = d2n('2026-12-01'); const m = S.mats[0]; const p = m.done0 + Math.floor((P0(m)(S.today - 1) - m.done0) * 0.7); S.pos.a = p; S.weekStartPos.a = p; } },
  review:     { label: '復習期間', f: () => { S.today = reviewStart() + 2; } },
  before:     { label: '始める日より前', f: () => { S.today = d2n('2026-11-01'); } },
};
function applyPreset(k) {
  S.pos = {}; S.weekStartPos = {};
  S.today = S.exam.start;
  PRESETS[k].f();
  for (const m of S.mats) if (S.pos[m.id] === undefined) S.pos[m.id] = S.today < S.exam.start ? m.done0 : (S.today >= reviewStart() ? m.end : P0(m)(S.today - 1));
  if (S.today === S.exam.start) for (const m of S.mats) S.pos[m.id] = m.done0;
}

// ---------- 根拠の一言 ----------
const TIPS = {
  proximal: '大きな目標は、今日の小さな範囲に分けると取りかかりやすく、自信にもつながることが分かっています。',
  intent: 'いつ・どこでやるかを先に決めておくと、実際に取りかかれる割合が上がることが分かっています。',
  fallacy: '人は、かかる時間を少なく見積もりがちです。だから週に1日、遅れを取り戻すための予備日を取っています。',
  fresh: '週の初めは、仕切り直しにちょうどよい区切りです。先週の遅れは今週の予定に配り直しました。',
  lapse: '1日できなくても、習慣は崩れないことが分かっています。まず1ページだけ開いてみましょう。',
  progFirst: '前半は「どれだけ終わったか」を見るほうが、続けやすいことが分かっています。',
  progSecond: '後半は「あと少し」を見るほうが、最後まで続けやすいことが分かっています。表示を「あと何問」に切り替えました。',
  retrieval: '読み返すより、解き直すほうが記憶に残ることが分かっています。',
  spacing: '一度に詰め込むより、日を分けて学ぶほうが記憶に残ります。だから試験日までの毎日に割り振っています。',
};
const TIP_METHOD = { proximal: 'proximal', intent: 'intent', fallacy: 'fallacy', fresh: 'lapse', lapse: 'lapse', progFirst: 'small', progSecond: 'small', retrieval: 'retrieval', spacing: 'spacing' };
const tip = k => `<div class="tip"><span class="label">根拠</span>${TIPS[k]} <a href="#" data-go="methods" data-anchor="${TIP_METHOD[k]}">詳しく</a></div>`;

// ---------- 画面 ----------
let view = 'home', preset = 'start';
const params = new URLSearchParams(location.search);
if (params.get('view')) view = params.get('view');
if (params.get('preset')) preset = params.get('preset');
const showBar = params.get('bar') !== '0';
applyPreset(preset);

function bar() {
  if (!showBar) return '';
  const views = { setup1: '設定①', setup2: '設定②', setup3: '設定③', setup4: '設定④', home: 'ホーム', widgets: 'ウィジェット・通知', methods: '進め方' };
  return `<div class="bar">
    <div class="row">画面 <select id="v">${Object.entries(views).map(([k, l]) => `<option value="${k}" ${k === view ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="row">場面 <select id="p">${Object.entries(PRESETS).map(([k, o]) => `<option value="${k}" ${k === preset ? 'selected' : ''}>${o.label}</option>`).join('')}</select>
      <button id="nextDay">翌日へ</button></div>
    <div class="row note">試作の操作バー（アプリの一部ではない）。今日: ${mdw(S.today)}</div>
  </div>`;
}

function header() {
  const t = Math.max(S.today, S.exam.start);
  const h = sumH(t, S.exam.date);
  return `<header><div class="exam">${S.exam.name}まで　勉強に使える時間</div>
    <h1>あと ${h}<small>時間</small></h1>
    <div class="sub">試験日 ${mdw(S.exam.date)}・あと${S.exam.date - S.today}日</div></header>`;
}

function home() {
  const t = S.today, w = S.week[wd(t)];
  const sts = S.mats.map(m => [m, stateOf(m)]);
  const ph = sts[0][1].phase;
  let out = header();
  const tips = [];

  if (ph === 'before') {
    out += `<div class="card"><div class="banner">${mdw(S.exam.start)} から始めます</div>
      <div class="big">それまでは何もしなくて大丈夫です。</div></div>`;
    return out + links();
  }

  if (ph === 'review') {
    out += `<div class="card"><div class="banner">復習期間（あと${sts[0][1].daysLeft}日）</div>
      <div class="when">${mdw(t)} ${w.t}〜 ${w.p}</div>`;
    for (const [m, s] of sts) {
      out += `<div class="item"><div class="name">${m.name}　今日の復習</div>` +
        (s.range ? `<div class="range">${s.range}</div><div class="btns"><button class="btn">終わった</button></div>` : `<div class="next">今日はなし</div>`) + `</div>`;
    }
    out += `<div class="muted" style="margin-top:8px">復習期間の記録は、付けなくてもかまいません。</div></div>`;
    tips.push('retrieval');
    return out + tips.map(tip).join('') + links();
  }

  const buffer = ph === 'buffer';
  const allOk = buffer && sts.every(([, s]) => !s.catchup);
  out += `<div class="card">`;
  if (buffer) out += `<div class="banner">今日は予備日</div>`;
  else if (sts[0][1].newWeek) out += `<div class="banner">新しい週です</div>`;
  if (!allOk) out += `<h2>${buffer ? '取り戻し' : '今日やること'}</h2>`;
  out += `<div class="when">${mdw(t)} ${w.t}〜 ${w.p}</div>`;
  if (allOk) out += `<div class="done">遅れはありません</div><div class="big" style="margin-top:4px">休んでも、先に進んでもOKです。</div>`;
  for (const [m, s] of allOk ? [] : sts) {
    out += `<div class="item"><div class="name">${m.name}</div>`;
    if (buffer) {
      out += s.catchup ? `<div class="range">${s.catchup}</div>${buttons(m.id, s.catchEnd)}` : `<div class="done">遅れなし</div>`;
    } else if (s.range) {
      out += `<div class="range">${s.range}</div>${buttons(m.id, s.rangeEnd)}`;
    } else if (s.todayHad) {
      out += `<div class="done">今日の分は終わりました</div>`;
    } else {
      out += `<div class="next">今日はなし${s.next ? `（次は ${mdw(s.next)}）` : ''}</div>`;
    }
    out += `</div>`;
  }
  out += `</div>`;

  // 週の様子と進み具合
  const s0 = sts[0][1], m0 = sts[0][0];
  out += `<div class="card"><div class="status">`;
  if (!buffer) {
    const late = sts.filter(([, s]) => s.behind > 0);
    out += late.length
      ? `<span class="warn">今週は ${late.map(([m, s]) => s.behindText).join('・')}遅れ → ${WD[S.bufferWd]}曜に取り戻します</span>`
      : `<span class="ok">今週は予定どおり</span>`;
  } else out += `<span class="ok">予備日のあと、新しい週が始まります</span>`;
  out += `</div><div class="status progs" style="margin-top:6px">${sts.map(([m, s]) => `<span class="prog">${m.name}：${s.prog}</span>`).join('')}</div></div>`;

  // 間に合わない見込み
  const risky = sts.filter(([, s]) => s.risk !== null);
  if (risky.length) {
    const [m, s] = risky[0];
    out += `<div class="card risk"><div class="banner">このペースだと間に合わない見込みです</div>
      <p>${m.name}は、復習期間に入るまでに ${U[m.unit].r(s.risk, s.risk)}あたりまでの見込みです（${U[m.unit].n(m.end)}中）。</p>
      <div class="btns"><button class="btn primary">対策を見る</button></div></div>`;
    tips.push('fallacy');
  }

  if (buffer) tips.push('fallacy');
  else if (s0.newWeek) tips.push('fresh');
  else if (s0.behind > 0) tips.push('lapse');
  else if (t >= secondHalfStart() && t - secondHalfStart() <= 2) tips.push('progSecond');
  else if (t === S.exam.start) tips.push('proximal');
  return out + tips.slice(0, 1).map(tip).join('') + links();
}

function buttons(id, end) {
  return `<div class="btns"><button class="btn primary" data-done="${id}" data-end="${end}">終わった</button><button class="btn" data-partial="${id}">途中まで</button></div>`;
}
const links = () => `<div class="links"><a href="#" data-go="methods">このアプリの進め方</a><a href="#" data-go="widgets">ウィジェット・通知</a></div>`;

function steps(k) { return `<div class="steps">${[1, 2, 3, 4].map(i => `<span class="${i <= k ? 'on' : ''}"></span>`).join('')}</div>`; }

function setup1() {
  return `<div class="setup">${steps(1)}<h1>どの試験を受けますか</h1>
    <p class="lead">試験日までの、勉強に使える時間を数えます。</p>
    <div class="card"><div class="field">試験名<span class="v">${S.exam.name}</span></div>
      <div class="field">試験日<span class="v">2027/1/30（土）</span></div></div>
    <div class="card"><div class="field">勉強を始める日<span class="v">今日（11/3）</span></div>
      <div class="hint">日付が2つある試験は、2つに分けて登録し、2つ目の始める日を1つ目の試験日の後にしてください。</div></div>
    <button class="btn primary next-btn" data-go="setup2">次へ</button></div>`;
}
function setup2() {
  return `<div class="setup">${steps(2)}<h1>何で勉強しますか</h1>
    <p class="lead">教材の範囲を、毎日の「今日やる範囲」に分けます。ページや問題の数のように、細かい単位で入れてください。</p>
    <div class="card"><div class="field">教材名<span class="v">テキスト</span></div>
      <div class="field">単位<span class="v">ページ</span></div>
      <div class="field">範囲<span class="v">p.1 〜 p.360</span></div>
      <div class="field">もう終わっているところ<span class="v">なし</span></div></div>
    <p class="lead muted">2冊目の教材は、あとから足せます。</p>
    ${tip('proximal')}
    <button class="btn primary next-btn" data-go="setup3">次へ</button></div>`;
}
function setup3() {
  const row = (l, i) => `<div>${l}</div><div class="c">${S.week[i].h}時間</div><div class="c">${S.week[i].t}〜</div><div class="c">${S.week[i].p}</div>`;
  return `<div class="setup">${steps(3)}<h1>いつ・どこでやりますか</h1>
    <p class="lead">勉強に使える時間と、始める時刻・場所を決めてください。その時刻にお知らせします。</p>
    <div class="card"><div class="wk"><div></div><div class="h">時間</div><div class="h">始める時刻</div><div class="h">場所</div>
      ${row('平日', 1)}${row('土', 6)}${row('日', 0)}</div>
      <div class="linkish">曜日ごとに変える</div></div>
    ${tip('intent')}
    <button class="btn primary next-btn" data-go="setup4">次へ</button></div>`;
}
function setup4() {
  const h = sumH(S.exam.start, S.exam.date);
  const rh = sumH(reviewStart(), S.exam.date);
  return `<div class="setup confirm">${steps(4)}<h1>この計画で始めます</h1>
    <div class="card"><div class="big">試験まで <b>${totalDays()}</b> 日</div>
      <div class="big">勉強に使える時間 <b>${h}</b> 時間</div></div>
    <div class="card"><ul>
      <li>試験前の<b>${reviewLen()}日間</b>（${rh}時間）は、新しい範囲に進まず<b>復習</b>にあてます</li>
      <li>毎週<b>${WD[S.bufferWd]}曜</b>は<b>予備日</b>にします。遅れたときに取り戻す日です</li>
      <li>残りの日に、空き時間に合わせて範囲を割り振ります</li></ul>
      <div class="muted">復習期間と予備日は、あとで変えられます。</div></div>
    ${tip('fallacy')}
    <button class="btn primary next-btn" data-go="home">始める</button></div>`;
}

const METHODS = [
  { id: 'proximal', t: '大きな目標を、今日の小さな範囲に分ける', what: '試験までの範囲を、1日ごとの「今日やる範囲」に分けます。', why: '遠い大きな目標だけを持つより、近くて小さな目標に分けたほうが、自信がつき、成績も上がりました。', app: 'ホームの「今日やること」', src: 'Bandura & Schunk (1981)' },
  { id: 'intent', t: 'いつ・どこでやるかを先に決める', what: '「平日 21:00〜 リビングで」のように、始める時刻と場所を決めておきます。', why: '「いつ・どこで・何をするか」を先に決めておくと、実際に取りかかる割合が上がることが、多くの研究で確かめられています。', app: '曜日ごとの時刻と場所。その時刻にお知らせします', src: 'Gollwitzer (1999); Gollwitzer & Sheeran (2006)' },
  { id: 'fallacy', t: '予備日を取る', what: '週に1日、新しい範囲を入れない日を取り、遅れを取り戻す日にします。', why: '人は、かかる時間をいつも少なく見積もります（計画錯誤）。余裕を先に取っておくと、計画が崩れにくくなります。', app: '週に1日の予備日と、ペースの見込み', src: 'Kahneman & Tversky (1979); Buehler ほか (1994)' },
  { id: 'spacing', t: '毎日に分けて学ぶ', what: '試験直前にまとめてやらず、試験日までの毎日に分けます。', why: '一度に詰め込むより、日を分けて学ぶほうが記憶に残ります。', app: '試験日までの毎日への割り振り', src: 'Cepeda ほか (2006); Dunlosky ほか (2013)' },
  { id: 'monitor', t: 'どこまで進んだかを記録する', what: '終わったら「終わった」を押して、進み具合を記録します。', why: '進み具合を記録して確かめると、目標を達成しやすくなります。', app: '「終わった」「途中まで」', src: 'Harkin ほか (2016)' },
  { id: 'small', t: '前半は「終わった量」、後半は「残りの量」を見る', what: '前半は「問12まで終わった」、後半は「あと8問」と、進み具合の見せ方を変えます。', why: '目標の前半は終わった量を、後半は残りの量を見るほうが、続けやすいことが分かっています。', app: 'ホームの進み具合（自動で切り替わります）', src: 'Koo & Fishbach (2012)' },
  { id: 'lapse', t: '1日休んでも気にしない', what: 'できない日があっても、次の日に戻れば大丈夫です。週の初めは仕切り直しの日にします。', why: '習慣は1日休んでも崩れませんでした。また、週の初めのような区切りの日は、目標に取り組み直しやすくなります。', app: '予備日のあとの「新しい週」。連続日数で責めません', src: 'Lally ほか (2010); Dai, Milkman & Riis (2014)' },
  { id: 'retrieval', t: '読み返すより、解き直す', what: '復習期間には、読み返すより問題を解き直します。', why: '自分で思い出すことは、読み返すよりずっと記憶に残ります。', app: '復習期間の「今日の復習」', src: 'Roediger & Karpicke (2006); Dunlosky ほか (2013)' },
];
function methods() {
  return `<a class="back" href="#" data-go="home">‹ 戻る</a>
    <header><h1 style="font-size:28px">このアプリの進め方</h1>
    <div class="sub">このアプリの進め方は、研究で効果が確かめられた方法に基づいています。</div></header>
    ${METHODS.map(m => `<div class="card method" id="m-${m.id}"><h3>${m.t}</h3><dl>
      <dt>何をするか</dt><dd>${m.what}</dd><dt>なぜ効くか</dt><dd>${m.why}</dd>
      <dt>このアプリでは</dt><dd>${m.app}</dd><dt>出典</dt><dd>${m.src}</dd></dl></div>`).join('')}
    <p class="cap">※試作のため、出典はまだ原典で確かめていません。</p>`;
}

function widgets() {
  const m = S.mats[0], s = stateOf(m), w = S.week[wd(S.today)];
  const h = sumH(Math.max(S.today, S.exam.start), S.exam.date);
  const r = s.range || s.catchup || '—';
  const lateMsg = `まず1ページだけ開いてみましょう。${m.name} ${U[m.unit].r(S.pos[m.id] + 1, S.pos[m.id] + 1)}から`;
  return `<a class="back" href="#" data-go="home">‹ 戻る</a>
    <p class="cap">ロック画面（ウィジェットと通知）</p>
    <div class="wall"><div class="date">${mdw(S.today)}</div><div class="clock">${w.t}</div>
      <div class="inline">${h}h・${r}</div>
      <div class="notif"><span class="t">今</span><b>試験カウントダウン</b><br>${w.t} です。${w.p}で${m.name} ${r.split('〜')[0]}〜</div>
      <div class="notif"><span class="t">遅れている日</span><b>試験カウントダウン</b><br>${lateMsg}</div></div>
    <p class="cap">ホーム画面のウィジェット（小）</p>
    <div class="wall" style="display:flex;gap:14px"><div class="widget"><div class="e">${S.exam.name}まで</div>
      <div class="n">${h}<small>時間</small></div><div class="r">今日 ${r}</div></div></div>`;
}

const VIEWS = { home, setup1, setup2, setup3, setup4, methods, widgets };
function render(anchor) {
  document.getElementById('app').innerHTML = bar() + VIEWS[view]();
  window.scrollTo(0, 0);
  if (anchor) { const el = document.getElementById('m-' + anchor); if (el) el.scrollIntoView(); }
}
document.addEventListener('change', e => {
  if (e.target.id === 'v') { view = e.target.value; render(); }
  if (e.target.id === 'p') { preset = e.target.value; applyPreset(preset); view = view.startsWith('setup') || view === 'methods' ? 'home' : view; render(); }
});
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); view = g.dataset.go; render(g.dataset.anchor); return; }
  if (e.target.dataset.done) { S.pos[e.target.dataset.done] = Number(e.target.dataset.end); render(); return; }
  if (e.target.dataset.partial) {
    const id = e.target.dataset.partial, v = prompt('今どこまで終わりましたか（番号）', S.pos[id]);
    if (v !== null && !isNaN(Number(v))) { S.pos[id] = Number(v); render(); }
    return;
  }
  if (e.target.id === 'nextDay') {
    const t = S.today;
    if (isBuffer(t)) for (const m of S.mats) S.weekStartPos[m.id] = S.pos[m.id]; // 予備日のあとに配り直す
    S.today = t + 1; preset = ''; render();
  }
});
render();
</script>
</body>
</html>
